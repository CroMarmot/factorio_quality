[project]
name = "factorio-quality"
version = "0.1.0"
description = "Factorio 品质（Quality）机制：理论文档与数值模拟"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "jupytext>=1.16",
]
dev = [
    "ruff>=0.6",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
package = false
